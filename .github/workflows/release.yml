name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            build_args: ""
            artifact: windows-installer
          - os: ubuntu-latest
            bundles: deb,appimage
            build_args: ""
            artifact: linux-installer
          - os: macos-latest
            bundles: dmg
            build_args: --target universal-apple-darwin
            artifact: macos-installer

    env:
      # .NET SDK is required to build the MSI bundle (WiX Toolset)
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # universal-apple-darwin = Intel (x86_64) + Apple Silicon (arm64) in one binary
      - name: Add Rust targets for macOS universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      # One-time setup: create a GPG key and store it in the repo secrets
      #   GPG_PRIVATE_KEY  -> armored private key (gpg --armor --export-secret-keys <id>)
      #   GPG_PASSPHRASE   -> passphrase of that key
      - name: Import GPG signing key (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::warning::GPG_PRIVATE_KEY secret is not set - the AppImage will be published UNSIGNED."
            exit 0
          fi
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "::warning::GPG_PASSPHRASE secret is not set - the AppImage will be published UNSIGNED."
            exit 0
          fi

          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')"
          if [ -z "$KEY_ID" ]; then
            echo "::error::No secret key could be imported from GPG_PRIVATE_KEY."
            exit 1
          fi

          mkdir -p signing
          gpg --armor --export "$KEY_ID" > signing/gpg-public.asc
          echo "Imported signing key: $KEY_ID"

          # consumed by the Tauri/appimagetool bundling step
          {
            echo "SIGN=1"
            echo "SIGN_KEY=$KEY_ID"
            echo "APPIMAGETOOL_SIGN_PASSPHRASE=$GPG_PASSPHRASE"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
          } >> "$GITHUB_ENV"

      - name: Sync version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must look like v1.2.3 (SemVer)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          echo "Releasing version $VERSION"

          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;

            const confPath = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
            conf.version = v;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");

            const pkgPath = "package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = v;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            fs.writeFileSync(cargoPath, cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${v}"`));
          '

          echo "tauri.conf.json -> $(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "package.json    -> $(node -p "require('./package.json').version")"
          echo "Cargo.toml      -> $(grep -m1 '^version' src-tauri/Cargo.toml)"

      - name: Install frontend dependencies
        run: npm ci

      # Self-signed code signing certificate.
      # If WINDOWS_CERTIFICATE (+ _PASSWORD) secrets are provided (a real CA-issued
      # .pfx later on, base64 encoded via `certutil -encode`) that certificate is
      # imported; otherwise an ephemeral self-signed certificate is created so the
      # installers are always signed. Self-signed keeps the "unknown publisher"
      # warning - it does NOT replace a CA certificate.
      - name: Prepare Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path signing | Out-Null

          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "Importing certificate from WINDOWS_CERTIFICATE secret..."
            $pfx = Join-Path (Get-Location) 'signing\certificate.pfx'

            # the secret holds the .pfx as base64
            $b64 = $env:WINDOWS_CERTIFICATE -replace '\s', ''
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
            }
            catch {
              # fall back to certutil, which also accepts -----BEGIN----- style output
              $tmp = Join-Path (Get-Location) 'signing\certificate.b64'
              Set-Content -Path $tmp -Value $env:WINDOWS_CERTIFICATE -Encoding ascii
              & certutil -decode $tmp $pfx | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_CERTIFICATE could not be decoded as base64.' }
              Remove-Item $tmp -Force
            }

            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Remove-Item $pfx -Force
          }
          else {
            Write-Host "No WINDOWS_CERTIFICATE secret found - generating an ephemeral self-signed certificate."
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject 'CN=ADM' `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyExportPolicy Exportable `
              -KeyLength 2048 `
              -KeyAlgorithm RSA `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(3)
          }

          $thumb = $cert.Thumbprint
          Write-Host "Certificate: $($cert.Subject) ($thumb)"

          # public part -> published as a release asset so users can install it
          Export-Certificate -Cert $cert -FilePath signing\adm-code-signing.cer | Out-Null

          # platform specific config, merged automatically by the Tauri CLI
          $windowsConfig = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumb
                digestAlgorithm       = 'sha256'
                timestampUrl          = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri\tauri.windows.conf.json -Value $windowsConfig -Encoding utf8
          Get-Content src-tauri\tauri.windows.conf.json

      - name: Build installers
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.build_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # --target universal-apple-darwin writes to target/<triple>/release/bundle
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

      # public part of the signing certificate - users can install it into
      # "Trusted Root" to remove the publisher warning on their own machines
      - name: Upload code-signing certificate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-code-signing-cert
          path: signing/adm-code-signing.cer
          if-no-files-found: warn
          retention-days: 7

      - name: Upload public signing key
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: gpg-public-key
          path: signing/gpg-public.asc
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Tarayıcı eklentisi: tarayıcıya göre kurulum dosyaları
  #
  # Üretilenler: extension.crx (kendi anahtarınla imzalı), extension-firefox.xpi
  # (AMO'da unlisted imzalı), update.xml / updates.json (otomatik güncelleme),
  # Setup-ADM-Extension-<sürüm>.exe (Windows kurulumu) ve imzasız Safari
  # uygulaması (deneysel).
  #
  # Gerekli secret'lar ve sınırlar için README > "Tarayıcı eklentisi sürümü".
  # ---------------------------------------------------------------------------
  extension:
    name: Browser extension packages
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      ext_id: ${{ steps.id.outputs.ext_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve extension version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      # The key is fixed forever: losing it changes the extension ID and breaks
      # both the force-install policy and the update chain.
      - name: Write CRX signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRX_PRIVATE_KEY}" ]; then
            echo "::error::CRX_PRIVATE_KEY secret is not set - see README > 'Tarayici eklentisi surumu'."
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$CRX_PRIVATE_KEY" > keys/extension.pem

      - name: Build per-browser packages
        env:
          EXT_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run extension:dist

      # The manifest declares gecko.update_url, which addons-linter flags for
      # store-listed add-ons. Self-hosted (unlisted) distribution needs it, so
      # lint output is informational only.
      - name: Lint Firefox package
        run: npx web-ext lint --source-dir src-extension/dist/firefox || true

      - name: Pack CRX and compute extension ID
        id: id
        shell: bash
        run: |
          set -euo pipefail
          npm run extension:crx
          EXT_ID=$(node scripts/extension-id.mjs)
          echo "ext_id=$EXT_ID" >> "$GITHUB_OUTPUT"
          echo "Chromium extension ID: $EXT_ID"

      - name: Generate update manifests
        env:
          EXT_VERSION: ${{ steps.ver.outputs.version }}
          EXT_ID: ${{ steps.id.outputs.ext_id }}
        run: npm run extension:update-files

      # AMO signs unlisted add-ons for free; without credentials the step is
      # skipped and the release ships without extension-firefox.xpi.
      - name: Sign Firefox XPI (AMO, unlisted)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        shell: bash
        run: |
          set -euo pipefail
          npx web-ext sign \
            --source-dir src-extension/dist/firefox \
            --artifacts-dir firefox-signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          cp firefox-signed/*.xpi src-extension/release/extension-firefox.xpi

      - name: Upload extension packages
        uses: actions/upload-artifact@v7
        with:
          name: extension-release
          path: src-extension/release/
          if-no-files-found: error
          retention-days: 7

  extension-windows-installer:
    name: Windows extension installer
    needs: extension
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Rebuilt here on purpose: shipping the unpacked Chromium payload as its
      # own artifact would also drop it into the GitHub release.
      - name: Build per-browser packages
        env:
          EXT_VERSION: ${{ needs.extension.outputs.version }}
        run: npm run extension:dist

      - name: Download signed packages
        uses: actions/download-artifact@v8
        with:
          name: extension-release
          path: src-extension/release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content src-extension/extension.config.json -Raw -Encoding utf8 | ConvertFrom-Json
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $updateUrl = 'https://github.com/${{ github.repository }}/releases/latest/download/update.xml'
          & $iscc `
            "/DAppName=$($cfg.name)" `
            "/DAppVersion=${{ needs.extension.outputs.version }}" `
            "/DExtId=${{ needs.extension.outputs.ext_id }}" `
            "/DUpdateUrl=$updateUrl" `
            src-extension\installer\windows\extension.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: extension-windows-installer
          path: src-extension/installer-out/*.exe
          if-no-files-found: error
          retention-days: 7

  # Experimental: unsigned Safari app. Without an Apple Developer certificate it
  # only runs with Safari > Develop > "Allow Unsigned Extensions" enabled.
  extension-safari:
    name: Safari extension (unsigned, experimental)
    needs: extension
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Chromium package
        env:
          EXT_VERSION: ${{ needs.extension.outputs.version }}
        run: npm run extension:dist

      - name: Convert and build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          SLUG=$(node -p "require('./src-extension/extension.config.json').slug")
          xcrun safari-web-extension-converter src-extension/dist/chromium \
            --project-location safari-project \
            --app-name "$SLUG" \
            --bundle-identifier "com.unal.adm.browserextension" \
            --macos-only --no-open --no-prompt --copy-resources
          xcodebuild -project "safari-project/$SLUG/$SLUG.xcodeproj" \
            -scheme "$SLUG" -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/safari-build" build
          ditto -c -k --keepParent "safari-build/$SLUG.app" "safari-unsigned-macos.zip"

      - name: Upload Safari app
        uses: actions/upload-artifact@v7
        with:
          name: extension-safari
          path: safari-unsigned-macos.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [build, extension, extension-windows-installer, extension-safari]
    # The Safari job is experimental and may fail without blocking the release.
    if: ${{ always() && needs.build.result == 'success' && needs.extension.result == 'success' && needs.extension-windows-installer.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f -printf '%f (%s bytes)\n' | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ADM ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*
