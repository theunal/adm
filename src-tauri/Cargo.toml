[package]
name = "adm"
version = "0.1.0"
description = "ADM - Advanced Download Manager"
authors = ["you"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "sync",
  "io-util",
  "time",
  "process",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "stream",
  "http2",
  "charset",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
  "derive",
] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
bytes = "1.12.1"
dashmap = "6.2.1"
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
